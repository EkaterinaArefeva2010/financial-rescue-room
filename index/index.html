<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Rescue Room</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #07100d;
            color: #f2f5f3;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;
            min-height: 100vh;
            width: 100%;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 72% 48%,
                    rgba(130, 255, 205, 0.09),
                    transparent 28%
                ),
                #07100d;
        }

        .hero-content {
            position: relative;
            z-index: 5;

            min-height: 100vh;
            padding: 52px 7vw 60px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            max-width: 1100px;
        }

        .hero-kicker {
            font-size: 12px;
            letter-spacing: 0.24em;
            text-transform: uppercase;

            color: #91e8c2;

            margin-bottom: 32px;
        }

        .hero-title {
            font-size: clamp(72px, 10vw, 150px);
            line-height: 0.84;
            letter-spacing: -0.065em;
            font-weight: 500;

            text-transform: uppercase;

            max-width: 850px;
        }

        .hero-title span {
            display: block;
        }

        .hero-subtitle {
            margin-top: 42px;

            font-size: 18px;
            line-height: 1.5;

            color: rgba(242, 245, 243, 0.65);

            letter-spacing: 0.02em;
        }

        .start-button {
            margin-top: 44px;

            width: fit-content;

            padding: 17px 29px;

            border: 1px solid rgba(145, 232, 194, 0.65);
            border-radius: 100px;

            background: rgba(145, 232, 194, 0.08);

            color: #a7f2cf;

            font-size: 12px;
            font-weight: 600;

            letter-spacing: 0.18em;
            text-transform: uppercase;

            text-decoration: none;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease;
        }

        .start-button:hover {
            background: #91e8c2;
            color: #07100d;
            transform: translateY(-2px);
        }

        /* =========================
           ABSTRACT FINANCIAL OBJECT
        ========================= */

        .hero-visual {
            position: absolute;

            width: 620px;
            height: 620px;

            right: 5vw;
            top: 50%;

            transform: translateY(-50%);

            pointer-events: none;
        }

        .orb {
            position: absolute;

            width: 410px;
            height: 410px;

            right: 55px;
            top: 95px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 32% 28%,
                    rgba(220, 255, 241, 0.95),
                    rgba(145, 232, 194, 0.55) 22%,
                    rgba(70, 154, 122, 0.22) 55%,
                    rgba(0, 0, 0, 0) 72%
                );

            filter: blur(0.2px);

            box-shadow:
                0 0 100px rgba(145, 232, 194, 0.12);
        }

        .ring {
            position: absolute;

            border: 1px solid rgba(145, 232, 194, 0.34);

            border-radius: 50%;

            transform: rotate(-18deg);
        }

        .ring-one {
            width: 520px;
            height: 180px;

            right: 0;
            top: 210px;
        }

        .ring-two {
            width: 500px;
            height: 160px;

            right: 25px;
            top: 230px;

            transform: rotate(31deg);
        }

        .ring-three {
            width: 420px;
            height: 140px;

            right: 65px;
            top: 245px;

            transform: rotate(70deg);

            border-color: rgba(145, 232, 194, 0.18);
        }

        .financial-line {
            position: absolute;

            width: 430px;
            height: 1px;

            right: 75px;
            top: 307px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(145, 232, 194, 0.7),
                transparent
            );

            transform: rotate(-28deg);
        }

        .financial-line::after {
            content: "";

            position: absolute;

            width: 7px;
            height: 7px;

            right: 70px;
            top: -3px;

            border-radius: 50%;

            background: #a7f2cf;

            box-shadow:
                0 0 18px rgba(145, 232, 194, 0.8);
        }

        .small-orb {
            position: absolute;

            width: 65px;
            height: 65px;

            right: 40px;
            top: 120px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #d7fff0,
                    #74d9b0 35%,
                    #193e31 75%
                );

            box-shadow:
                0 0 45px rgba(145, 232, 194, 0.18);
        }

        .small-orb-two {
            position: absolute;

            width: 25px;
            height: 25px;

            right: 470px;
            top: 445px;

            border-radius: 50%;

            background: #91e8c2;

            box-shadow:
                0 0 25px rgba(145, 232, 194, 0.45);
        }

        /* =========================
           AUTHOR CREDIT
        ========================= */

        .author-credit {
            position: absolute;

            right: 7vw;
            bottom: 38px;

            z-index: 10;

            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;

            color: rgba(242, 245, 243, 0.42);
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .hero-content {
                padding: 42px 7vw;
                justify-content: flex-start;
                padding-top: 18vh;
            }

            .hero-title {
                font-size: clamp(58px, 15vw, 105px);
            }

            .hero-visual {
                width: 500px;
                height: 500px;

                right: -190px;
                top: 62%;
            }

            .author-credit {
                right: 7vw;
                bottom: 25px;
            }
        }

        @media (max-width: 600px) {

            .hero {
                min-height: 100svh;
            }

            .hero-content {
                padding: 35px 25px;
                padding-top: 16vh;
            }

            .hero-kicker {
                margin-bottom: 24px;
            }

            .hero-title {
                font-size: 62px;
            }

            .hero-subtitle {
                font-size: 16px;
                margin-top: 30px;
            }

            .start-button {
                margin-top: 32px;
            }

            .hero-visual {
                width: 400px;
                height: 400px;

                right: -175px;
                top: 70%;
            }

            .orb {
                width: 270px;
                height: 270px;
            }

            .ring-one {
                width: 360px;
                height: 130px;
            }

            .ring-two {
                width: 340px;
                height: 115px;
            }

            .ring-three {
                width: 300px;
                height: 100px;
            }

            .financial-line {
                width: 300px;
            }

            .author-credit {
                font-size: 8px;
                bottom: 18px;
            }
        }
    </style>
</head>

<body>

    <main>

        <!-- =========================
             HERO SECTION
        ========================= -->

        <section class="hero">

            <div class="hero-content">

                <div class="hero-kicker">
                    Financial Simulation
                </div>

                <h1 class="hero-title">
                    <span>Financial</span>
                    <span>Rescue Room</span>
                </h1>

                <p class="hero-subtitle">
                    Diagnose. Decide. Recover.
                </p>

                <a href="#simulation" class="start-button">
                    Start Simulation
                </a>

            </div>


            <!-- ABSTRACT FINANCIAL VISUAL -->

            <div class="hero-visual">

                <div class="orb"></div>

                <div class="ring ring-one"></div>
                <div class="ring ring-two"></div>
                <div class="ring ring-three"></div>

                <div class="financial-line"></div>

                <div class="small-orb"></div>
                <div class="small-orb-two"></div>

            </div>


            <!-- AUTHOR CREDIT -->

            <div class="author-credit">
                Made by Ekaterina Arefeva
            </div>

        </section>

    </main>

</body>
</html>
